general:
  kafka-topic: some-test-topic

kafka:
  topic:
    transactions: transactions-topic

server:
  port: 33400

spring:
  kafka:
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.jpmc.midascore.model.Transaction
      group-id: midas-core
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  datasource:
    url: jdbc:h2:mem:midas
    driverClassName: org.h2.Driver
    username: sa
    password:
