general:
  kafka-topic: midas-transactions

incentive:
  api:
    url: http://localhost:8080/transaction

server:
  port: 33400

spring:
  datasource:
    url: jdbc:h2:mem:midasdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  kafka:
    consumer:
      bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
      group-id: midas-consumer-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.jpmc.midascore.entity.Transaction
        spring.json.trusted.packages: "com.jpmc.midascore.entity,com.jpmc.midascore.foundation"
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
    producer:
      bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    org.springframework: INFO
    com.jpmc.midascore: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type: TRACE