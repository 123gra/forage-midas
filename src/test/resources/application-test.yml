spring:
  # Test-specific H2 Database Configuration
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
    
  # JPA Configuration for tests
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        
  # Kafka Test Configuration - will be overridden by @EmbeddedKafka
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      group-id: test-group
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.jpmc.midascore.foundation"

# Application-specific configuration for tests
general:
  kafka-topic: test-transaction-topic

# Logging configuration for tests
logging:
  level:
    com.jpmc.midascore: INFO
    org.springframework.kafka: WARN
    org.apache.kafka: WARN
    org.testcontainers: WARN
