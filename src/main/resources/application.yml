spring:
  profiles:
    active: local
  datasource:
    url: jdbc:h2:mem:midas
    username: sweta
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
