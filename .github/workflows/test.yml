name: Run Forage Midas Tests
on:
  push:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Docker for Testcontainers
        uses: docker/setup-docker@v3
      - name: Build and run Incentive API
        run: |
          cd incentive-api
          echo "server.port=8080" > src/main/resources/application.properties
          ./gradlew bootRun &
          sleep 10 # Wait for server
      - name: Build and run Midas Core
        run: |
          cd midas-core
          echo "server.port=33400" > src/main/resources/application.properties
          ./gradlew bootRun &
          sleep 10
      - name: Run TaskFiveTests
        run: |
          cd midas-core
          ./gradlew test --tests TaskFiveTests
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: midas-core/build/reports/tests/test/
